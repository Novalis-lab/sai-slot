<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- LINEやXでシェアしたときの表示 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="novalis">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:url" content="https://novalis-lab.github.io/sai-slot/">
  <meta property="og:title" content="サイ⚪︎スロット｜予算内のメニューをスロットで決める1000円ガチャ">
  <meta property="og:description" content="予算を入れて回すだけ。予算内で食べられるメニューの組み合わせがランダムで出てくる非公式の無料ツール。今日なに食べるか迷ったときに。">
  <meta property="og:image" content="https://novalis-lab.github.io/sai-slot/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="サイ⚪︎スロット - 予算内のメニューの組み合わせをスロットでランダムに決める">
  <meta name="twitter:card" content="summary_large_image">
  <!-- 検索エンジン向けのツール情報 -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "サイ⚪︎スロット",
    "url": "https://novalis-lab.github.io/sai-slot/",
    "description": "予算内で食べられるメニューの組み合わせをスロットでランダムに決める非公式の無料ツール。",
    "applicationCategory": "LifestyleApplication",
    "operatingSystem": "Web",
    "inLanguage": "ja",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" },
    "isPartOf": { "@type": "WebSite", "name": "novalis", "url": "https://novalis-lab.github.io/" }
  }
  </script>
  <meta name="theme-color" content="#1f6b3a">
  <!-- サイトのアイコン（novalis共通のロゴ） -->
  <link rel="icon" href="https://novalis-lab.github.io/icon.svg" type="image/svg+xml">
  <link rel="icon" href="https://novalis-lab.github.io/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="https://novalis-lab.github.io/apple-touch-icon.png">
  <!-- フォント（Google Fonts・無料） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Unbounded:wght@800&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <!-- 上のバー：novalisのトップへ戻る -->
    <nav class="topbar" aria-label="サイト">
      <a class="home" href="https://novalis-lab.github.io/">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <defs>
            <linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="150" y1="110" x2="380" y2="400">
              <stop offset="0" stop-color="#22d3ee"/><stop offset="0.55" stop-color="#7c6cff"/><stop offset="1" stop-color="#ff5ea8"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="112" fill="#0b0c18" stroke="rgba(255,255,255,0.25)" stroke-width="8"/>
          <path d="M164 370 V158 L348 362 V254" fill="none" stroke="url(#lg)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M352 82 C358 124 370 136 412 146 C370 156 358 168 352 210 C346 168 334 156 292 146 C334 136 346 124 352 82 Z" fill="#ffffff"/>
        </svg>
        <span class="home-name">NOVALIS</span>
      </a>
      <a class="back" href="https://novalis-lab.github.io/"><span aria-hidden="true">←</span>トップへ</a>
    </nav>
    <p class="flag" aria-hidden="true"><span></span><span></span><span></span></p>
    <!-- class="mosaic" をつけた文字はモザイクがかかります -->
    <h1><span class="mosaic">サイ⚪︎</span>スロット</h1>
    <p class="lead">予算を入れて回すだけ。今日のメニューをスロットが決めます。</p>
  </header>

  <main class="container">
    <!-- 入力エリア -->
    <section class="card controls" aria-label="条件の設定">
      <label class="budget-label" for="budget">予算</label>
      <div class="budget-row">
        <button type="button" class="step" data-step="-100" aria-label="100円減らす">−</button>
        <div class="budget-input">
          <input id="budget" type="number" inputmode="numeric" min="100" max="20000" step="10" value="2000">
          <span>円</span>
        </div>
        <button type="button" class="step" data-step="100" aria-label="100円増やす">＋</button>
      </div>
      <div class="presets" role="group" aria-label="よく使う予算">
        <button type="button" data-budget="500">500円</button>
        <button type="button" data-budget="1000">1000円</button>
        <button type="button" data-budget="1500">1500円</button>
        <button type="button" data-budget="2000">2000円</button>
        <button type="button" data-budget="3000">3000円</button>
      </div>

      <div class="options">
        <label class="switch">
          <input type="checkbox" id="opt-drinkbar">
          <span class="switch-ui" aria-hidden="true"></span>
          <span class="switch-text">ドリンクバーを含める <small id="drinkbar-price"></small></span>
        </label>
        <label class="switch">
          <input type="checkbox" id="opt-main" checked>
          <span class="switch-ui" aria-hidden="true"></span>
          <span class="switch-text">主食（パスタ・ピザ・ドリア・肉料理）を必ず1品入れる</span>
        </label>
      </div>

      <details class="categories">
        <summary>出てくるカテゴリを選ぶ</summary>
        <div id="category-list" class="category-list"></div>
      </details>
    </section>

    <button type="button" id="spin" class="spin-button">スロットを回す</button>
    <p id="message" class="message" role="alert" hidden></p>

    <!-- 結果エリア -->
    <section id="result" class="card result" aria-live="polite" hidden>
      <h2 class="result-title">今日のメニュー</h2>
      <ol id="reels" class="reels"></ol>
      <div class="summary">
        <div class="summary-row">
          <span>合計</span>
          <strong id="total">0円</strong>
        </div>
        <div class="summary-row">
          <span>予算の残り</span>
          <strong id="remain">0円</strong>
        </div>
        <div class="meter" aria-hidden="true"><div id="meter-bar" class="meter-bar"></div></div>
        <p id="verdict" class="verdict"></p>
      </div>
      <p class="hint">左の数字は注文用紙に書くメニュー番号です</p>
    </section>

    <!-- 広告スペース：将来ここに広告のコードを貼り付けます -->
    <aside class="ad-slot" aria-label="広告">
      <!-- 例：Google AdSense のコードをこの中に貼る -->
      <span class="ad-placeholder">広告スペース</span>
    </aside>
  </main>

  <footer class="site-footer">
    <a class="footer-home" href="https://novalis-lab.github.io/">ほかのツールも見る<span aria-hidden="true">→</span></a>
    <p class="disclaimer">非公式ツールです。価格は店舗や時期によって異なる場合があります</p>
    <p class="version">メニュー：<span id="menu-version"></span></p>
  </footer>

  <!-- メニューデータを先に読み込み、そのあとプログラムを読み込みます -->
  <script src="menu-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
